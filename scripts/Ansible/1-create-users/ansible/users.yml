- name: deploy users
  hosts: all
  become: yes
  vars:
    users_admin:
    - "Adriend671"
    - "mqrcus456"
    - "ZHLoic"
    - "GGiraud"
  tasks:
  - name: create group admin
    group:
      name: "admin"
      state: present

  - name: create admin user accounts
    user:
      name: "{{ item }}"
      groups: "admin"
      shell: /bin/bash
      create_home: yes
 
    with_items:
    - "{{ users_admin }}"

  - name: add authorized keys
    authorized_key:
      user: "{{ item }}"
      key: "{{ lookup('file', 'files/'+ item + '.key.pub') }}"
    with_items: 
    - "{{ users_admin }}"
 
  - name: Allow admin users to sudo without password
    copy:
      dest: /etc/sudoers.d/admin
      content: "%admin ALL=(ALL) NOPASSWD: ALL"
      mode: '0440'
      validate: /usr/sbin/visudo -cf %s

