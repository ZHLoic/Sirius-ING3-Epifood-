server {
    listen 8080;

    server_name 172.31.240.6;                                           #ip à redistribuer
    location = / {
        return 302 /auth/login?next=http://172.31.249.231:8080/;
    }
    location / {
        proxy_pass http://172.31.249.231:8080/;                         #ip destination
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
