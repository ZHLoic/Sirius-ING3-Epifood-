server {
        listen 80;
        server_name airflow;
        ## Redirige le HTTP vers le HTTPS ##
        return 301 https://$server_name:443$request_uri;
}

server {
    listen 443 ssl;

    server_name airflow;                                         #ip à redistribuer

    location = / {
        return 302 /auth/login?next=http://epifood-airflow:8080/;
    }

    ssl_certificate     /etc/nginx/ssl/certs/airflow.crt;
    ssl_certificate_key /etc/nginx/ssl/private/airflow.key;

    location / {
        proxy_pass http://epifood-airflow:8080/;                         #ip destination
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}