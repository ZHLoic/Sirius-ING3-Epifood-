#worker_processes  5; #nombre max de thread

events {
    worker_connections  1024; # nombre maximum de connexion à un thread
}

http {
    access_log /var/log/nginx/access.log combined;

    keepalive_timeout 10s; # https://www.ubuntumint.com/enable-nginx-keepalive-connections/
    keepalive_requests 1000;

    ssl_session_cache shared:SSL:50m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_prefer_server_ciphers on;
    ssl_protocols TLSv1 TLSv1.1 TLSv1.2;

    #server {
    #    listen 80;
    #    return 301 https://$host$request_uri;
    #}

    include conf.d/http_conf.d/*.conf;
}

stream{
    include conf.d/stream_conf.d/*.conf;
}